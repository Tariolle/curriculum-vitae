name: Build CV PDFs

on:
  push:
    branches:
      - master
    paths:
      - cv.tex
      - short.tex
      - full.tex
      - Makefile
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            short.tex
            full.tex

      - name: Preserve portfolio download compatibility
        run: cp short.pdf main.pdf

      - name: Commit updated PDFs
        id: commit
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- main.pdf short.pdf full.pdf)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f main.pdf short.pdf full.pdf
            git commit -m "Build CV PDFs"
            git push
          else
            echo "CV PDFs are already up to date."
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The portfolio serves this PDF and rebuilds only when told to.
      - name: Trigger portfolio redeploy
        if: steps.commit.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN is not set; the portfolio was not redeployed."
            exit 0
          fi

          gh api repos/Tariolle/Tariolle.github.io/dispatches \
            -f event_type=cv-updated \
            -f "client_payload[sha]=$SHA"
